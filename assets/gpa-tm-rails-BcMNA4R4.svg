<svg viewBox="0 0 920 600" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A0A0C"/>
      <stop offset="100%" stop-color="#2B0F12"/>
    </linearGradient>
    <linearGradient id="gem" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B6B"/>
      <stop offset="100%" stop-color="#B0121A"/>
    </linearGradient>
  </defs>

  <rect width="920" height="600" fill="url(#bg2)"/>

  <!-- faceted gem motif (Ruby language nod) sitting above a small grade bar chart -->
  <g transform="translate(700,190)">
    <polygon points="0,-90 78,-20 44,90 -44,90 -78,-20" fill="url(#gem)" opacity="0.92"/>
    <polygon points="0,-90 78,-20 0,20 -78,-20" fill="#FF8F8F" opacity="0.35"/>
    <polygon points="0,20 44,90 -44,90 -78,-20 0,-90" fill="none" stroke="#5A0409" stroke-width="1.5" opacity="0.4"/>
    <line x1="0" y1="-90" x2="0" y2="20" stroke="#5A0409" stroke-width="1.5" opacity="0.4"/>
    <line x1="-78" y1="-20" x2="78" y2="-20" stroke="#5A0409" stroke-width="1.5" opacity="0.4"/>
  </g>

  <!-- small grade bars, referencing GPA tracking -->
  <g transform="translate(612,330)">
    <rect x="0" y="40" width="14" height="30" fill="#E85C5C" opacity="0.8"/>
    <rect x="24" y="20" width="14" height="50" fill="#E85C5C" opacity="0.8"/>
    <rect x="48" y="0" width="14" height="70" fill="#FF8F8F"/>
    <rect x="72" y="26" width="14" height="44" fill="#E85C5C" opacity="0.8"/>
  </g>

  <line x1="80" y1="446" x2="128" y2="446" stroke="#E85C5C" stroke-width="4"/>

  <text x="80" y="410" fill="#F7EAEA" font-size="66" font-weight="700" letter-spacing="-1">gpa_tm</text>
  <text x="80" y="484" fill="#C79A9A" font-size="24" font-weight="400">GPA tracking &amp; management tool</text>
  <text x="80" y="522" fill="#E85C5C" font-size="20" font-weight="600">Ruby on Rails</text>

  <text x="80" y="70" fill="#7A5555" font-size="18" letter-spacing="1">dev-abdul-majeed / gpa_tm</text>
</svg>
