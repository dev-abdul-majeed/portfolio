<svg viewBox="0 0 920 600" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0F1E"/>
      <stop offset="100%" stop-color="#131B33"/>
    </linearGradient>
    <radialGradient id="glow1" cx="72%" cy="34%" r="55%">
      <stop offset="0%" stop-color="#61DAFB" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#61DAFB" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="920" height="600" fill="url(#bg1)"/>
  <rect width="920" height="600" fill="url(#glow1)"/>

  <!-- orbit motif: three tilted rings with small "game" nodes, evoking both React's atom and a game map -->
  <g transform="translate(660,220)">
    <ellipse cx="0" cy="0" rx="180" ry="66" fill="none" stroke="#61DAFB" stroke-width="2" opacity="0.55"/>
    <ellipse cx="0" cy="0" rx="180" ry="66" fill="none" stroke="#61DAFB" stroke-width="2" opacity="0.55" transform="rotate(60)"/>
    <ellipse cx="0" cy="0" rx="180" ry="66" fill="none" stroke="#61DAFB" stroke-width="2" opacity="0.55" transform="rotate(120)"/>
    <circle cx="0" cy="0" r="12" fill="#61DAFB"/>
    <circle cx="176" cy="-8" r="6" fill="#A78BFA"/>
    <circle cx="-140" cy="42" r="5" fill="#F472B6"/>
    <circle cx="60" cy="-60" r="4.5" fill="#FBBF24"/>
    <circle cx="-100" cy="-46" r="5" fill="#34D399"/>
  </g>

  <!-- baseline rule marks where the type block begins -->
  <line x1="80" y1="446" x2="128" y2="446" stroke="#61DAFB" stroke-width="4"/>

  <text x="80" y="410" fill="#F4F6FB" font-size="66" font-weight="700" letter-spacing="-1">Rawg-io</text>
  <text x="80" y="484" fill="#9AA7C7" font-size="24" font-weight="400">Game discovery app built with React</text>
  <text x="80" y="522" fill="#61DAFB" font-size="20" font-weight="600">React · RAWG API</text>

  <text x="80" y="70" fill="#5B6584" font-size="18" letter-spacing="1">dev-abdul-majeed / Rawg-io</text>
</svg>
