<svg viewBox="0 0 920 600" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12161D"/>
      <stop offset="100%" stop-color="#1B222C"/>
    </linearGradient>
  </defs>

  <rect width="920" height="600" fill="url(#bg3)"/>

  <!-- grid of task blocks, referencing a workload management board; varied fill = varied load -->
  <g transform="translate(560,120)">
    <g fill="#2A323D">
      <rect x="0"   y="0"   width="52" height="52"/>
      <rect x="64"  y="0"   width="52" height="52"/>
      <rect x="128" y="0"   width="52" height="52"/>
      <rect x="192" y="0"   width="52" height="52"/>
      <rect x="0"   y="64"  width="52" height="52"/>
      <rect x="64"  y="64"  width="52" height="52"/>
      <rect x="128" y="64"  width="52" height="52"/>
      <rect x="192" y="64"  width="52" height="52"/>
      <rect x="0"   y="128" width="52" height="52"/>
      <rect x="64"  y="128" width="52" height="52"/>
      <rect x="128" y="128" width="52" height="52"/>
      <rect x="192" y="128" width="52" height="52"/>
    </g>
    <rect x="64"  y="0"   width="52" height="52" fill="#ED8B00"/>
    <rect x="192" y="0"   width="52" height="52" fill="#ED8B00" opacity="0.55"/>
    <rect x="0"   y="64"  width="52" height="52" fill="#ED8B00" opacity="0.55"/>
    <rect x="128" y="64"  width="52" height="52" fill="#ED8B00"/>
    <rect x="192" y="128" width="52" height="52" fill="#ED8B00" opacity="0.55"/>
  </g>

  <!-- small coffee cup mark, nodding to Java -->
  <g transform="translate(640,380)" stroke="#ED8B00" stroke-width="5" fill="none" stroke-linecap="round">
    <path d="M0,0 h70 v34 a35,35 0 0 1 -35,35 h0 a35,35 0 0 1 -35,-35 z"/>
    <path d="M70,10 h14 a14,14 0 0 1 0,28 h-14"/>
    <path d="M18,-14 q6,-10 0,-20" opacity="0.7"/>
    <path d="M40,-14 q6,-10 0,-20" opacity="0.7"/>
  </g>

  <line x1="80" y1="446" x2="128" y2="446" stroke="#ED8B00" stroke-width="4"/>

  <text x="80" y="410" fill="#F0F2F5" font-size="60" font-weight="700" letter-spacing="-1">WorkloadMS</text>
  <text x="80" y="484" fill="#9AA3AF" font-size="24" font-weight="400">Workload management system</text>
  <text x="80" y="522" fill="#ED8B00" font-size="20" font-weight="600">Java</text>

  <text x="80" y="70" fill="#5C6470" font-size="18" letter-spacing="1">dev-abdul-majeed / WorkloadMS</text>
</svg>
