    <rect x="26" y="36" width="90" height="12" rx="6" fill="#00D8FF" opacity="0.85"/>
    <rect x="26" y="66" width="148" height="46" rx="10" fill="#332B70"/>
    <rect x="26" y="122" width="148" height="46" rx="10" fill="#332B70"/>
    <rect x="26" y="178" width="148" height="46" rx="10" fill="#332B70"/>
