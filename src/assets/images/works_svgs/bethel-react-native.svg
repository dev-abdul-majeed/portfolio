  <line x1="80" y1="446" x2="128" y2="446" stroke="#00D8FF" stroke-width="4"/>

  <text x="80" y="410" fill="#F2F1FB" font-size="66" font-weight="700" letter-spacing="-1">Bethel</text>
  <text x="80" y="484" fill="#A7A2D6" font-size="24" font-weight="400">Cross-platform mobile app</text>
  <text x="80" y="522" fill="#00D8FF" font-size="20" font-weight="600">React Native</text>

  <text x="80" y="70" fill="#615A9E" font-size="18" letter-spacing="1">dev-abdul-majeed / bethel</text>
